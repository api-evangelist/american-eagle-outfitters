source: live HTTPS probes of the named /.well-known/ paths on every American Eagle Outfitters brand host
note: >-
  Probed 2026-09-02 with a browser User-Agent. American Eagle Outfitters serves NO
  /.well-known/ documents from its flagship hosts (www.ae.com, www.aerie.com) — every named
  path returns 404 or an Akamai 403 there. Real documents were found only on
  www.unsubscribed.com, the AEO brand storefront running on Shopify: a UCP merchant
  profile, an OpenID Connect discovery document and an OAuth protected-resource document.
  Those three are Shopify-platform-provided surfaces served from an AEO-controlled
  hostname, not documents AEO authored; they are recorded as served because that is what
  an agent hitting the host actually gets. www.toddsnyder.com (also an AEO brand on
  Shopify, behind Cloudflare) answered a managed-challenge 403 on every /.well-known/
  path, so its posture is unknown rather than absent. No security.txt, no api-catalog,
  no ai-plugin.json and no A2A agent card anywhere in the estate.
