domain_standards:
- market: retail / e-commerce
  standard: Universal Commerce Protocol (UCP) 2026-08-25
  declared: true
  operator: platform
  spec_location: /.well-known/ucp.json -> ucp.services["dev.ucp.shopping"][0]
  note: >-
    UCP is the agentic-commerce standard for this market and AEO's Unsubscribed storefront
    declares it with a version and a live service. The declaration is Shopify's
    implementation running under AEO's hostname, so it is recorded at platform attribution,
    not self.
