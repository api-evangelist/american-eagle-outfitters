description: >-
  American Eagle Outfitters (AEO) is a global specialty retailer operating
  the American Eagle and Aerie brands, offering on-trend clothing, accessories,
  and personal care products at affordable prices. The company operates over
  1,000 stores across the Americas and online, with a unified commerce
  strategy spanning e-commerce, mobile, and in-store experiences.
