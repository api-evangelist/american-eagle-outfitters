apis:
  - aid: american-eagle-outfitters:unsubscribed-commerce
    name: Unsubscribed Commerce (UCP/MCP)
    description: >-
      The one callable, machine-reachable surface in the American Eagle Outfitters estate:
      a Universal Commerce Protocol shopping server, transported over MCP, on the
      Unsubscribed brand storefront. Anonymous discovery returns 13 tools with full JSON
      Schema inputs covering catalog search, product lookup, cart, checkout and order
      retrieval. It is a Shopify platform capability served from an AEO-controlled
      hostname rather than an API AEO authored, and it is recorded that way — but it is
      what an agent actually reaches when it shops an AEO brand.
    humanURL: https://www.unsubscribed.com/agents.md
    baseURL: https://www.unsubscribed.com/api/ucp/mcp
    tags:
      - Agentic Commerce
      - MCP
      - Universal Commerce Protocol
      - E-Commerce
      - Retail
