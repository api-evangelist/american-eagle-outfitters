note: >-
  A rate-limit policy is stated in prose but no number is published anywhere. The
  Unsubscribed agents.md tells agents the MCP endpoint is rate-limited per IP and to back
  off on 429, which is a genuine runtime signal, but it names no ceiling, no window, no
  burst and no response header. limit_count is therefore an honest 0: the policy exists,
  the quantity does not. American Eagle's flagship hosts (www.ae.com, www.aerie.com) publish
  no limits at all and sit behind an Akamai edge that returns 403 Access Denied to
  non-browser clients.
