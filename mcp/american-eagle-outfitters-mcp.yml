method: probed
source: https://www.unsubscribed.com/api/ucp/mcp
name: Unsubscribed Commerce (UCP/MCP)
description: 'American Eagle Outfitters exposes one live, anonymously reachable MCP endpoint across its
  estate: the Universal Commerce Protocol (UCP) shopping server on www.unsubscribed.com, the AEO brand
  storefront running on Shopify. It answers `initialize` and `tools/list` without credentials and returns
  13 real tools with full JSON Schema inputs covering catalog search, cart, checkout and order lookup.
  It is a Shopify platform capability served from an AEO-controlled hostname, not a server AEO wrote —
  but it is the surface an agent actually reaches when it shops an AEO brand, so it is recorded as present.'
ownership:
  host_controlled_by: American Eagle Outfitters, Inc.
  evidence: unsubscribed.com terms of service carry "© 2021 AEO MANAGEMENT CO. ALL RIGHTS RESERVED" and
    name "American Eagle Outfitters, Inc., 77 Hot Metal Street, Pittsburgh, Pennsylvania 15203, copyrightalert@ae.com"
    as the DMCA agent; www.aeo-inc.com lists Unsubscribed as one of AEO's five brands and links to www.unsubscribed.com.
  authored_by: Shopify (platform-provided UCP implementation)
deployment:
  mode: remote
  endpoint: https://www.unsubscribed.com/api/ucp/mcp
  auth: none
  verified: probed
  note: Discovery (initialize, tools/list) is fully anonymous. tools/call, prompts/list and resources/list
    are gated on a UCP agent profile — they return JSON-RPC error -32001 "UCP discovery failed" / invalid_profile_url
    until the caller supplies meta["ucp-agent"].profile. There is no API key and no OAuth on the discovery
    path.
